apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # PriorityClasses zuerst — die Workloads aus drova-gitops/base referenzieren
  # app-standard; ohne sie erzeugt kein ReplicaSet Pods.
  - priorityclass.yaml
  - ../../drova-gitops/base
  - configmap.yaml
  - test-credentials.yaml
  # Simple Deployment replaces the Rollout for api-gateway in e2e
  - api-gateway-e2e.yaml

namespace: drova-e2e

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
  # Rollout disabled in e2e — api-gateway-e2e.yaml provides a simple Deployment instead
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
    target:
      kind: Rollout
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
    target:
      kind: Deployment
  # Not needed for smoke tests — avoids pulling 300MB image
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
    target:
      kind: Deployment
      name: schema-registry
  # CI Kafka has no TLS — clear the cert path so the client uses plaintext
  - path: patch-no-kafka-tls.yaml
