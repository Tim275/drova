services:

  # ── Infrastructure ────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: drova
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: drova
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drova"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: drova
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  kafka-ui:
    image: redpandadata/console:latest
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  schema-registry:
    image: quay.io/apicurio/apicurio-registry:3.2.3
    ports:
      - "127.0.0.1:8086:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/apis/registry/v3/system/info || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.57
    ports:
      - "127.0.0.1:16686:16686"   # UI
      - "127.0.0.1:14268:14268"   # Thrift HTTP
      - "127.0.0.1:4317:4317"     # OTLP gRPC (for otel-collector → jaeger)
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    command: ["--query.max-clock-skew-adjustment=5ms"]
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.150.1
    ports:
      - "127.0.0.1:4318:4318"   # OTLP HTTP — services connect here
      - "127.0.0.1:8889:8889"   # Prometheus scrape endpoint
    volumes:
      - ./infra/local/otel-collector.yaml:/etc/otelcol-contrib/config.yaml
    depends_on:
      - jaeger
      - loki
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.52.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/local/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    depends_on:
      - otel-collector
    restart: unless-stopped

  loki:
    image: grafana/loki:3.0.0
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.19@sha256:a9043254ba16fb10945cc27333963dfd08eccbb43b51f1222d831cc564e3a1f4
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor traceToMetrics
    volumes:
      - ./infra/local/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - jaeger
    restart: unless-stopped

  # ── Application Services ──────────────────────────────────────────────────────

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    ports:
      - "127.0.0.1:8082:8082"
      - "127.0.0.1:9091:9091"
    environment:
      HTTP_ADDR: ":8082"
      GRPC_ADDR: ":9091"
      MIGRATIONS_PATH: migrations
      SEED: "true"
      DB_URL: postgres://drova:${POSTGRES_PASSWORD}@postgres:5432/drova?sslmode=disable
      REDIS_URL: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      APP_BASE_URL: ${APP_BASE_URL}
      OTEL_COLLECTOR_ENDPOINT: otel-collector:4318
      ENVIRONMENT: development
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      FROM_EMAIL: ${FROM_EMAIL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  trip-service:
    build:
      context: .
      dockerfile: services/trip-service/Dockerfile
    ports:
      - "127.0.0.1:9093:9093"
    environment:
      HTTP_ADDR: ":8083"
      GRPC_ADDR: ":9093"
      MAPBOX_TOKEN: ${MAPBOX_TOKEN}
      SERVICE_REFERER: ${APP_BASE_URL:-http://localhost:8081}
      KAFKA_BROKERS: kafka:9092
      OTEL_COLLECTOR_ENDPOINT: otel-collector:4318
      ENVIRONMENT: development
      DB_URL: postgres://drova:${POSTGRES_PASSWORD}@postgres:5432/drova?sslmode=disable&x-migrations-table=trip_schema_migrations
      MIGRATIONS_PATH: migrations
      USER_SERVICE_GRPC_URL: user-service:9091
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      user-service:
        condition: service_started
    restart: on-failure

  driver-service:
    build:
      context: .
      dockerfile: services/driver-service/Dockerfile
    environment:
      GRPC_ADDR: ":9092"
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      OTEL_COLLECTOR_ENDPOINT: otel-collector:4318
      ENVIRONMENT: development
      DB_URL: postgres://drova:${POSTGRES_PASSWORD}@postgres:5432/drova?sslmode=disable&x-migrations-table=driver_schema_migrations
      MIGRATIONS_PATH: migrations
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    environment:
      KAFKA_BROKERS: kafka:9092
      OTEL_COLLECTOR_ENDPOINT: otel-collector:4318
      ENVIRONMENT: development
      PAYMENT_MODE: ${PAYMENT_MODE:-stripe}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8081}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-eur}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-http://localhost:8081/?payment=success}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-http://localhost:8081/?payment=cancel}
      DB_URL: postgres://drova:${POSTGRES_PASSWORD}@postgres:5432/drova?sslmode=disable&x-migrations-table=payment_schema_migrations
      MIGRATIONS_PATH: migrations
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: on-failure

  chat-service:
    build:
      context: .
      dockerfile: services/chat-service/Dockerfile
    ports:
      - "8084:8084"
    environment:
      HTTP_ADDR: ":8084"
      MONGO_URI: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017/drova?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      ENVIRONMENT: development
      OTEL_COLLECTOR_ENDPOINT: otel-collector:4318
      REDIS_URL: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "8081:8081"
    environment:
      HTTP_ADDR: ":8081"
      TRIP_SERVICE_URL: trip-service:9093
      TRIP_SERVICE_HTTP_URL: http://trip-service:8083
      DRIVER_SERVICE_URL: driver-service:9092
      USER_SERVICE_GRPC_URL: user-service:9091
      USER_SERVICE_URL: http://user-service:8082
      MAPBOX_PUBLIC_TOKEN: ${MAPBOX_PUBLIC_TOKEN}
      KAFKA_BROKERS: kafka:9092
      STRIPE_WEBHOOK_KEY: ${STRIPE_WEBHOOK_KEY}
      STRIPE_PUBLIC_KEY: ${STRIPE_PUBLIC_KEY}
      OTEL_COLLECTOR_ENDPOINT: otel-collector:4318
      ENVIRONMENT: development
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SCHEMA_REGISTRY_URL: http://schema-registry:8080/apis/ccompat/v7
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      user-service:
        condition: service_started
      trip-service:
        condition: service_started
      chat-service:
        condition: service_started
      driver-service:
        condition: service_started
      payment-service:
        condition: service_started
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8090:8080"
    depends_on:
      api-gateway:
        condition: service_started
      chat-service:
        condition: service_started
    restart: on-failure

volumes:
  postgres_data:
  redis_data:
  mongo_data:
  prometheus_data:
  loki_data:
  grafana_data:
