services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: drova
      POSTGRES_PASSWORD: drova
      POSTGRES_DB: drova
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drova"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: drova
      MONGO_INITDB_ROOT_PASSWORD: drova
      MONGO_INITDB_DATABASE: drova
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  kafka-ui:
    image: redpandadata/console:latest
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  jaeger:
    image: jaegertracing/all-in-one:1.49
    ports:
      - "16686:16686"  # UI
      - "14268:14268"  # Collector HTTP
      - "4318:4318"    # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  trip-service:
    build:
      context: .
      dockerfile: services/trip-service/Dockerfile
    ports:
      - "9093:9093"
    environment:
      - HTTP_ADDR=:8083
      - GRPC_ADDR=:9093
      - MAPBOX_TOKEN=${MAPBOX_TOKEN}
      - KAFKA_BROKERS=kafka:9092
      - JAEGER_ENDPOINT=jaeger:4318
      - ENVIRONMENT=development
    depends_on:
      kafka:
        condition: service_healthy

  driver-service:
    build:
      context: .
      dockerfile: services/driver-service/Dockerfile
    environment:
      - GRPC_ADDR=:9092
      - KAFKA_BROKERS=kafka:9092
      - JAEGER_ENDPOINT=jaeger:4318
      - ENVIRONMENT=development
    depends_on:
      kafka:
        condition: service_healthy

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    environment:
      - KAFKA_BROKERS=kafka:9092
      - JAEGER_ENDPOINT=jaeger:4318
      - ENVIRONMENT=development
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_CURRENCY=${STRIPE_CURRENCY}
      - STRIPE_SUCCESS_URL=${STRIPE_SUCCESS_URL}
      - STRIPE_CANCEL_URL=${STRIPE_CANCEL_URL}
    depends_on:
      kafka:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - HTTP_ADDR=:8081
      - TRIP_SERVICE_URL=trip-service:9093
      - DRIVER_SERVICE_URL=driver-service:9092
      - MAPBOX_PUBLIC_TOKEN=${MAPBOX_PUBLIC_TOKEN}
      - KAFKA_BROKERS=kafka:9092
      - STRIPE_WEBHOOK_KEY=${STRIPE_WEBHOOK_KEY}
      - STRIPE_PUBLIC_KEY=${STRIPE_PUBLIC_KEY}
      - JAEGER_ENDPOINT=jaeger:4318
      - ENVIRONMENT=development
    depends_on:
      kafka:
        condition: service_healthy
      trip-service:
        condition: service_started
      driver-service:
        condition: service_started
      payment-service:
        condition: service_started
      user-service:
        condition: service_started

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      - HTTP_ADDR=:8082
      - DB_URL=postgres://drova:drova@postgres:5432/drova?sslmode=disable
      - REDIS_URL=redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - MAILTRAP_HOST=${MAILTRAP_HOST}
      - MAILTRAP_PORT=${MAILTRAP_PORT}
      - MAILTRAP_USERNAME=${MAILTRAP_USERNAME}
      - MAILTRAP_PASSWORD=${MAILTRAP_PASSWORD}
      - JAEGER_ENDPOINT=jaeger:4318
      - ENVIRONMENT=development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  mongo_data:
