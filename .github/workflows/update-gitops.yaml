name: Update GitOps Repository

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
        description: "Release tag (e.g. v0.9.0)"
    secrets:
      GITOPS_PAT:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
        description: "Release tag (e.g. v0.9.0)"

jobs:
  update-gitops:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout drova-gitops repo
        uses: actions/checkout@v4
        with:
          repository: Tim275/drova-gitops
          token: ${{ secrets.GITOPS_PAT }}
          ref: main

      - name: Install yq
        env:
          YQ_VERSION: "v4.44.3"
          YQ_SHA256: "4622a6cd9ef61bcd30e9f04ac30bef73bde64fe5c05b2fafde9a9bbcd9b48bdc"
        run: |
          sudo wget -qO /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  /usr/local/bin/yq" | sha256sum --check
          sudo chmod +x /usr/local/bin/yq

      - name: Update staging image tags
        env:
          TAG: ${{ inputs.tag }}
        run: |
          yq e -i '(.images[] | select(.name | test("ghcr.io/tim275/drova/"))).newTag = strenv(TAG)' \
            overlays/staging/kustomization.yaml

      - name: Validate staging update
        env:
          TAG: ${{ inputs.tag }}
        run: |
          COUNT=$(yq e '[.images[].newTag] | map(select(. == strenv(TAG))) | length' overlays/staging/kustomization.yaml)
          if [ "$COUNT" -lt 1 ]; then
            echo "ERROR: No image tags updated to ${TAG} in staging — check yq selector"
            exit 1
          fi
          echo "Staging: ${COUNT} image(s) updated to ${TAG}"

      - name: Update production image tags
        env:
          TAG: ${{ inputs.tag }}
        run: |
          yq e -i '(.images[] | select(.name | test("ghcr.io/tim275/drova/"))).newTag = strenv(TAG)' \
            overlays/production/kustomization.yaml

      - name: Commit staging update
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git config user.name "GitOps Bot"
          git config user.email "gitops-bot@github.com"
          git add overlays/staging/kustomization.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore: deploy ${TAG} to staging"
          for i in 1 2 3; do
            git push && break
            echo "Push attempt ${i} failed, rebasing..."
            git pull --rebase origin main
          done

      - name: Create Production Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITOPS_PAT }}
          commit-message: "chore: update drova images to ${{ inputs.tag }}"
          committer: GitOps Bot <gitops-bot@github.com>
          author: GitOps Bot <gitops-bot@github.com>
          branch: gitops/release-${{ inputs.tag }}
          delete-branch: true
          title: "chore: deploy ${{ inputs.tag }} to production"
          body: |
            Updates all Drova service image tags to `${{ inputs.tag }}` in `overlays/production/kustomization.yaml`.

            Staging is already running `${{ inputs.tag }}`.

            Release: https://github.com/Tim275/drova/releases/tag/${{ inputs.tag }}
          labels: |
            automated-pr
            gitops

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::GitOps update failed for tag ${{ inputs.tag }} — staging or production may be out of sync"
