name: Update GitOps Repository

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
        description: "The tag name of the release"
    secrets:
      GITOPS_PAT:
        required: true
        description: "PAT for drova-gitops repository"
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
        description: "Release tag to redeploy (e.g. v0.15.0)"

jobs:
  update-gitops:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Actions Repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: actions-repo

      - name: Checkout GitOps repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: Tim275/drova-gitops
          token: ${{ secrets.GITOPS_PAT }}
          ref: main
          path: drova-gitops

      - name: Install yq
        run: |
          YQ_VERSION="v4.53.2"
          YQ_URL="https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo curl -sL "${YQ_URL}" -o /usr/local/bin/yq
          echo "d56bf5c6819e8e696340c312bd70f849dc1678a7cda9c2ad63eebd906371d56b  /usr/local/bin/yq" | sha256sum --check
          sudo chmod +x /usr/local/bin/yq

      - name: Update staging image tags
        run: |
          chmod +x ./actions-repo/scripts/update_kustomize_tag
          ./actions-repo/scripts/update_kustomize_tag \
            "${{ inputs.tag }}" \
            ./drova-gitops/overlays/staging/kustomization.yaml

      - uses: EndBug/add-and-commit@a94899bca583c204427a224a7af87c02f9b325d5 # v9
        with:
          author_name: GitOps Bot
          author_email: gitops-bot@github.com
          cwd: ./drova-gitops
          message: 'chore: deploy ${{ inputs.tag }} to staging'
          github_token: ${{ secrets.GITOPS_PAT }}

      - name: Wait for ArgoCD to pick up staging commit
        run: |
          echo "Waiting 90s for ArgoCD to detect and begin syncing..."
          sleep 90

      - name: Staging health check
        id: staging_health
        continue-on-error: true
        run: |
          STAGING_URL="${{ vars.STAGING_HEALTH_URL }}"
          if [ -z "$STAGING_URL" ]; then
            echo "⏭ STAGING_HEALTH_URL not set — skipping health check"
            exit 0
          fi
          MAX_ATTEMPTS=12
          INTERVAL=20

          echo "Polling ${STAGING_URL}/health (max ${MAX_ATTEMPTS} attempts, ${INTERVAL}s interval)..."

          for i in $(seq 1 $MAX_ATTEMPTS); do
            STATUS=$(curl -sf --max-time 10 -o /dev/null -w "%{http_code}" "${STAGING_URL}/health" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✓ Staging healthy after attempt ${i} ($(( (i-1) * INTERVAL + 90 ))s total)"
              exit 0
            fi
            echo "  [${i}/${MAX_ATTEMPTS}] HTTP ${STATUS} — retrying in ${INTERVAL}s..."
            sleep $INTERVAL
          done

          echo "❌ Staging not healthy after $(( MAX_ATTEMPTS * INTERVAL + 90 ))s — triggering rollback"
          exit 1

      - name: Auto-rollback staging
        if: steps.staging_health.outcome == 'failure'
        run: |
          cd drova-gitops
          git config user.name "GitOps Bot"
          git config user.email "gitops-bot@github.com"
          git revert HEAD --no-edit
          git push
          echo "❌ Staging rolled back to previous tag — production PR NOT created"

      - name: Update production image tags
        run: |
          ./actions-repo/scripts/update_kustomize_tag \
            "${{ inputs.tag }}" \
            ./drova-gitops/overlays/production/kustomization.yaml

      - name: Create Production Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITOPS_PAT }}
          path: ./drova-gitops
          commit-message: "chore: update drova images to ${{ inputs.tag }}"
          committer: GitOps Bot <gitops-bot@github.com>
          author: GitOps Bot <gitops-bot@github.com>
          branch: gitops/release-${{ inputs.tag }}
          delete-branch: true
          title: "deploy ${{ inputs.tag }} to production"
          body: |
            Updates all 7 drova service image tags to `${{ inputs.tag }}` in production.

            Release: https://github.com/Tim275/drova/releases/tag/${{ inputs.tag }}

            **Staging:** health check passed (or no staging cluster configured).

            **After merging:** run [Production Verify](https://github.com/Tim275/drova/actions/workflows/prod-verify.yaml) with tag `${{ inputs.tag }}` to confirm production health and auto-rollback if needed.
          labels: |
            automated-pr
            gitops
