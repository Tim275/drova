name: Update GitOps Repository

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
        description: "The tag name of the release"
    secrets:
      GITOPS_PAT:
        required: true
        description: "PAT for drova-gitops repository"

jobs:
  update-gitops:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Actions Repo
        uses: actions/checkout@v4
        with:
          path: actions-repo

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: Tim275/drova-gitops
          token: ${{ secrets.GITOPS_PAT }}
          ref: main
          path: drova-gitops

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update Image Tags Staging
        run: |
          KUSTOMIZATION_FILE="./drova-gitops/overlays/staging/kustomization.yaml"
          SCRIPT_PATH="./actions-repo/scripts/update_kustomize_tag"
          chmod +x "$SCRIPT_PATH"
          echo "Calling update script with tag: ${{ inputs.tag }}, file: $KUSTOMIZATION_FILE"
          "$SCRIPT_PATH" "${{ inputs.tag }}" "$KUSTOMIZATION_FILE"

      - uses: EndBug/add-and-commit@v9
        with:
          author_name: GitOps Bot
          author_email: gitops-bot@github.com
          cwd: ./drova-gitops
          message: 'Update drova deployments to tag "${{ inputs.tag }}"'
          github_token: ${{ secrets.GITOPS_PAT }}

      - name: Update Image Tags Production
        run: |
          KUSTOMIZATION_FILE="./drova-gitops/overlays/production/kustomization.yaml"
          SCRIPT_PATH="./actions-repo/scripts/update_kustomize_tag"
          echo "Calling update script with tag: ${{ inputs.tag }}, file: $KUSTOMIZATION_FILE"
          "$SCRIPT_PATH" "${{ inputs.tag }}" "$KUSTOMIZATION_FILE"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITOPS_PAT }}
          path: ./drova-gitops
          commit-message: "Update prod deployments to tag ${{ inputs.tag }}"
          committer: GitOps Bot <gitops-bot@github.com>
          author: GitOps Bot <gitops-bot@github.com>
          branch: gitops/update-tag-${{ inputs.tag }}
          delete-branch: true
          title: "Update prod image tags to ${{ inputs.tag }}"
          body: |
            Update all drova service image tags in the production environment kustomization to `${{ inputs.tag }}`.

            Release: https://github.com/Tim275/drova/releases/tag/${{ inputs.tag }}
          labels: |
            automated-pr
            gitops
