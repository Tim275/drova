name: Update GitOps Repository

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
        description: "Release tag (e.g. v0.9.0)"
    secrets:
      GITOPS_PAT:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
        description: "Release tag (e.g. v0.9.0)"

jobs:
  update-gitops:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout drova (scripts)
        uses: actions/checkout@v6
        with:
          path: actions-repo

      - name: Checkout drova-gitops
        uses: actions/checkout@v6
        with:
          repository: Tim275/drova-gitops
          token: ${{ secrets.GITOPS_PAT }}
          ref: main
          path: drova-gitops

      - name: Install yq
        env:
          YQ_VERSION: "v4.44.3"
          YQ_SHA256: "4622a6cd9ef61bcd30e9f04ac30bef73bde64fe5c05b2fafde9a9bbcd9b48bdc"
        run: |
          sudo wget -qO /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  /usr/local/bin/yq" | sha256sum --check
          sudo chmod +x /usr/local/bin/yq

      - name: Update staging image tags
        run: |
          bash actions-repo/scripts/update_kustomize_tag \
            "${{ inputs.tag }}" \
            drova-gitops/overlays/staging/kustomization.yaml

      - name: Commit staging update
        uses: EndBug/add-and-commit@v10
        with:
          cwd: drova-gitops
          add: overlays/staging/kustomization.yaml
          message: "chore: deploy ${{ inputs.tag }} to staging"
          default_author: github_actions
          github_token: ${{ secrets.GITOPS_PAT }}

      - name: Soak period
        run: |
          echo "Staging deployed. Soaking 3 minutes before opening production PR..."
          sleep 180

      - name: Update production image tags
        run: |
          bash actions-repo/scripts/update_kustomize_tag \
            "${{ inputs.tag }}" \
            drova-gitops/overlays/production/kustomization.yaml

      - name: Create production pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITOPS_PAT }}
          path: drova-gitops
          commit-message: "chore: update drova images to ${{ inputs.tag }}"
          committer: GitOps Bot <gitops-bot@github.com>
          author: GitOps Bot <gitops-bot@github.com>
          branch: gitops/release-${{ inputs.tag }}
          delete-branch: true
          title: "chore: deploy ${{ inputs.tag }} to production"
          body: |
            Updates all Drova service image tags to `${{ inputs.tag }}` in `overlays/production/kustomization.yaml`.

            Staging has been running `${{ inputs.tag }}` for ~3 minutes (soak period passed).

            Release: https://github.com/Tim275/drova/releases/tag/${{ inputs.tag }}
          labels: |
            automated-pr
            gitops

      - name: Write GitOps summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## GitOps Update — ${{ inputs.tag }}

          | Environment | Status |
          |---|---|
          | Staging | deployed (auto-commit via EndBug) |
          | Production | PR opened — awaiting review |

          **Soak period:** 3 minutes passed before production PR was opened.
          EOF

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::GitOps update failed for tag ${{ inputs.tag }} — staging or production may be out of sync"
