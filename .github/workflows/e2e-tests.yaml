name: E2E Tests

on:
  workflow_call:
    inputs:
      tag:
        required: false
        type: string
        default: ""
        description: "Image tag aus GHCR (leer = lokal bauen für PR)"
      run_full_scan:
        required: false
        type: boolean
        default: false
        description: "true = zusätzlich ZAP Active/Full Scan (langsam, greift an) — nur manuell/geplant, nicht im PR-Gate"
    secrets:
      GITOPS_PAT:
        required: true
      MAPBOX_TOKEN:
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  e2e:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Start infrastructure (host network)
        run: |
          # All containers on host network so k3d pods reach them at 172.17.0.1
          docker run -d --network host --name postgres \
            -e POSTGRES_USER=drova -e POSTGRES_PASSWORD=drova -e POSTGRES_DB=drova \
            postgres:17-alpine

          docker run -d --network host --name redis \
            redis:7-alpine

          docker run -d --network host --name kafka \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://172.17.0.1:9092 \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@127.0.0.1:9093 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk \
            confluentinc/cp-kafka:7.6.0

          docker run -d --network host --name mongo \
            mongo:7

          echo "Waiting for Postgres..."
          until docker exec postgres pg_isready -U drova 2>/dev/null; do sleep 2; done
          echo "✓ Postgres ready"

          echo "Creating per-service databases..."
          docker exec postgres psql -U drova -c "CREATE DATABASE drova_trips;"
          docker exec postgres psql -U drova -c "CREATE DATABASE drova_payments;"
          docker exec postgres psql -U drova -c "CREATE DATABASE drova_drivers;"
          echo "✓ Databases created"

          echo "Waiting for Redis..."
          until docker exec redis redis-cli ping 2>/dev/null | grep -q PONG; do sleep 2; done
          echo "✓ Redis ready"

          echo "Waiting for Kafka..."
          for _ in {1..40}; do
            if docker exec kafka kafka-broker-api-versions \
                 --bootstrap-server 127.0.0.1:9092 2>/dev/null; then
              echo "✓ Kafka ready"
              break
            fi
            sleep 3
          done

          echo "Waiting for MongoDB..."
          until docker exec mongo mongosh --eval 'db.runCommand({ping:1})' 2>/dev/null | grep -q ok; do sleep 2; done
          echo "✓ MongoDB ready"

      - name: Checkout drova-gitops
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Tim275/drova-gitops
          token: ${{ secrets.GITOPS_PAT }}
          path: drova-gitops

      - name: Install k3d
        run: |
          curl -fsSL "https://github.com/k3d-io/k3d/releases/download/v5.7.4/k3d-linux-amd64" \
            -o /tmp/k3d
          echo "1ac1da365236736a8df8c32107b54aca208384ab1d9a06771443c85ad698a5eb  /tmp/k3d" | sha256sum --check
          sudo install /tmp/k3d /usr/local/bin/k3d
          k3d version

      - name: Install kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5

      - name: Create k3d cluster
        run: |
          for i in 1 2 3; do
            docker pull ghcr.io/k3d-io/k3d-tools:5.7.4 && break
            echo "Pull attempt $i failed, retrying in 15s..."
            sleep 15
          done
          k3d cluster create drova-e2e \
            --no-lb \
            --k3s-arg "--disable=traefik@server:0" \
            --wait
          kubectl cluster-info

      - name: Install Argo Rollouts CRDs
        run: |
          # CRDs only — we don't use the controller in e2e (api-gateway runs as a plain Deployment)
          kubectl apply -f https://github.com/argoproj/argo-rollouts/releases/download/v1.7.2/install.yaml
          echo "✓ Argo Rollouts CRDs registered"

      - name: Install KEDA CRDs
        run: |
          # CRDs only — deploy/e2e pulls ScaledObjects from drova-gitops/base. No KEDA
          # controller runs in e2e (smoke tests don't exercise autoscaling); the CRDs just
          # let `kubectl apply -k` register the ScaledObjects instead of failing on an
          # unknown kind. --server-side avoids the client-side annotation size limit.
          # Pinned to the deployed KEDA (talos-homelab helm chart) for reproducibility;
          # Renovate bumps it via PR (custom.regex manager in renovate.json) so it stays current.
          # renovate: datasource=github-releases depName=kedacore/keda
          KEDA_VERSION=v2.20.1
          kubectl apply --server-side -f "https://github.com/kedacore/keda/releases/download/${KEDA_VERSION}/keda-${KEDA_VERSION#v}-crds.yaml"
          echo "✓ KEDA CRDs ${KEDA_VERSION} registered"

      - name: Login to GHCR
        if: inputs.tag != ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build images locally (PR mode)
        if: inputs.tag == ''
        run: |
          for svc in api-gateway user-service trip-service driver-service payment-service chat-service; do
            echo "Building $svc..."
            docker build -t ghcr.io/tim275/drova/$svc:latest \
              -f services/$svc/Dockerfile . -q
          done
          docker build -t ghcr.io/tim275/drova/frontend:latest \
            -f frontend/Dockerfile frontend/ -q

      - name: Pull images from GHCR (release mode)
        if: inputs.tag != ''
        run: |
          for svc in api-gateway user-service trip-service driver-service payment-service chat-service frontend; do
            docker pull ghcr.io/tim275/drova/$svc:${{ inputs.tag }}
            docker tag ghcr.io/tim275/drova/$svc:${{ inputs.tag }} \
                       ghcr.io/tim275/drova/$svc:latest
          done

      - name: Load images into k3d
        run: |
          for svc in api-gateway user-service trip-service driver-service payment-service chat-service frontend; do
            k3d image import ghcr.io/tim275/drova/$svc:latest -c drova-e2e
          done

      - name: Create namespace + deploy
        run: |
          kubectl create namespace drova-e2e
          kubectl apply -k deploy/e2e/
          kubectl rollout status deployment/api-gateway -n drova-e2e --timeout=180s
          kubectl rollout status deployment/user-service -n drova-e2e --timeout=300s
          kubectl rollout status deployment/trip-service -n drova-e2e --timeout=120s

      - name: Inject Mapbox token (enables trip-flow tests)
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: |
          if [ -z "$MAPBOX_TOKEN" ]; then
            echo "MAPBOX_TOKEN not set — TestTripPreview/TestCreateTrip will skip"
            exit 0
          fi
          kubectl -n drova-e2e patch secret drova-app-secrets \
            --type merge -p "{\"stringData\":{\"MAPBOX_TOKEN\":\"$MAPBOX_TOKEN\"}}"
          kubectl -n drova-e2e rollout restart deployment/trip-service
          kubectl -n drova-e2e rollout status deployment/trip-service --timeout=120s

      - name: Port-forward api-gateway
        run: |
          kubectl port-forward svc/api-gateway 8081:8081 -n drova-e2e &
          sleep 5

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run E2E smoke tests
        env:
          E2E_BASE_URL: http://localhost:8081
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: go test -v -tags=e2e -timeout 3m ./tests/e2e/...

      - name: Install k6
        run: |
          K6_VERSION=0.55.0
          curl -fsSL "https://github.com/grafana/k6/releases/download/v${K6_VERSION}/k6-v${K6_VERSION}-linux-amd64.tar.gz" \
            | tar xz
          sudo mv "k6-v${K6_VERSION}-linux-amd64/k6" /usr/local/bin/k6
          k6 version

      - name: Run k6 load test
        run: |
          k6 run \
            -e BASE_URL=http://localhost:8081 \
            -e E2E_TOKEN="" \
            -e K6_DURATION_THRESHOLD="p(95)<10000" \
            --out json=k6-results.json \
            tests/load/load-test.js

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: k6-results
          path: k6-results.json
          retention-days: 7

      - name: OWASP ZAP DAST scan
        run: |
          mkdir -p zap-report
          chmod 777 zap-report
          # rules.tsv = kuratierte False-Positive-Suppression (IGNORE/WARN je Regel).
          # Muss unter /zap/wrk liegen, daher der cp ins gemountete Verzeichnis.
          cp tests/security/rules.tsv zap-report/rules.tsv
          docker run --network host \
            -v "$(pwd)/zap-report:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://localhost:8081 \
            -c rules.tsv \
            -r zap-report.html \
            -J zap-report.json \
            -I

      - name: OWASP ZAP Active/Full Scan (authenticated, nur bei run_full_scan)
        if: ${{ inputs.run_full_scan }}
        run: |
          # Authenticated Active Scan: als rider einloggen, Bearer-Token via Hook
          # in JEDEN Request injizieren → scannt auch die Wege HINTER dem Login.
          # Aktiver Angriff (SQLi/XSS/Path-Traversal) gegen den wegwerfbaren k3d.
          # -I + || true → informierend, blockt nie.
          TOKEN=$(curl -sf -u "rider@drova.local:Test1234!" \
            -X POST http://localhost:8081/v1/auth/token | jq -r '.data.token // .token // empty')
          cp tests/security/auth_hook.py zap-report/auth_hook.py
          docker run --network host \
            -e ZAP_AUTH_TOKEN="$TOKEN" \
            -v "$(pwd)/zap-report:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-full-scan.py \
            -t http://localhost:8081 \
            -r zap-full-report.html \
            -J zap-full-report.json \
            --hook=/zap/wrk/auth_hook.py \
            -I || true

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zap-dast-report
          path: zap-report/
          retention-days: 14

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== all pods ==="
          kubectl get pods -n drova-e2e || true
          # Workload-Ebene ZUERST: darf ein ReplicaSet gar keinen Pod erzeugen
          # (Admission, fehlende PriorityClass, Quota), bleiben alle Pod-Diagnosen
          # unten leer ("No resources found") — der Grund steht dann ausschliesslich
          # in den ReplicaSet-Events.
          echo "=== deployments + replicasets (desired vs current) ==="
          kubectl get deploy,rs -n drova-e2e -o wide || true
          echo "=== events (Admission-/Scheduling-Fehler landen HIER) ==="
          kubectl get events -n drova-e2e --sort-by=.lastTimestamp | tail -40 || true
          echo "=== replicaset describe (warum entstehen keine Pods?) ==="
          kubectl describe rs -n drova-e2e | tail -60 || true
          echo "=== argo-rollouts controller logs ==="
          kubectl logs -n argo-rollouts -l app.kubernetes.io/name=argo-rollouts --tail=30 || true
          echo "=== api-gateway rollout ==="
          kubectl get rollout api-gateway -n drova-e2e -o yaml | tail -40 || true
          echo "=== api-gateway logs ==="
          kubectl logs -l app=api-gateway -n drova-e2e --tail=50 || true
          echo "=== user-service migrate (init container) ==="
          kubectl logs -l app=user-service -n drova-e2e -c migrate --tail=50 || true
          echo "=== user-service pod describe ==="
          kubectl describe pod -l app=user-service -n drova-e2e | tail -30 || true
          echo "=== trip-service migrate (init container) ==="
          kubectl logs -l app=trip-service -n drova-e2e -c migrate --tail=50 || true
          echo "=== trip-service pod describe ==="
          kubectl describe pod -l app=trip-service -n drova-e2e | tail -30 || true
          echo "=== trip-service logs ==="
          kubectl logs -l app=trip-service -n drova-e2e --tail=50 || true

      - name: Cleanup
        if: always()
        run: k3d cluster delete drova-e2e
