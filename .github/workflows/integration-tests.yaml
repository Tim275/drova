name: Integration Tests

on:
  pull_request:
    paths:
      - "services/**"
      - "shared/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/integration-tests.yaml"
  push:
    branches:
      - main
    paths:
      - "services/**"
      - "shared/**"

concurrency:
  group: integration-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: drova
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: drova_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379

      kafka:
        image: confluentinc/cp-kafka:7.6.1
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
        ports:
          - 9092:9092

    env:
      DB_URL: postgres://drova:testpassword@localhost:5432/drova_test?sslmode=disable
      REDIS_ADDR: localhost:6379
      KAFKA_BROKERS: localhost:9092
      GOFLAGS: "-mod=readonly"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Wait for Kafka
        run: |
          for i in $(seq 1 30); do
            if nc -z localhost 9092; then
              echo "Kafka ready"
              break
            fi
            echo "Waiting for Kafka... ($i/30)"
            sleep 2
          done

      - name: Run integration tests
        run: go test -tags=integration -race -count=1 -timeout 5m ./...

      - name: Write test summary
        if: always()
        run: |
          echo "## Integration Test Results" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Postgres | Redis | Kafka |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| All Services | ✅ localhost:5432 | ✅ localhost:6379 | ✅ localhost:9092 |" >> $GITHUB_STEP_SUMMARY
