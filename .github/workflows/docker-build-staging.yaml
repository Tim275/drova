name: Build and Deploy Staging

on:
  push:
    branches:
      - main

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/tim275/drova

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            dockerfile: services/api-gateway/Dockerfile
          - service: user-service
            dockerfile: services/user-service/Dockerfile
          - service: trip-service
            dockerfile: services/trip-service/Dockerfile
          - service: driver-service
            dockerfile: services/driver-service/Dockerfile
          - service: payment-service
            dockerfile: services/payment-service/Dockerfile
          - service: chat-service
            dockerfile: services/chat-service/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}-staging
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-staging
          platforms: linux/amd64

  update-staging:
    name: Update Staging GitOps
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.result == 'success'
    permissions:
      contents: write

    steps:
      - name: Checkout drova-gitops
        uses: actions/checkout@v4
        with:
          repository: Tim275/drova-gitops
          token: ${{ secrets.GITOPS_PAT }}
          ref: main

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update staging image tags
        env:
          TAG: sha-${{ github.sha }}
        run: |
          FILE="overlays/staging/kustomization.yaml"
          yq e -i '(.images[] | select(.name | test("ghcr.io/tim275/drova/"))).newTag = strenv(TAG)' "$FILE"

      - name: Commit and push
        env:
          SHA: ${{ github.sha }}
        run: |
          git config user.name "GitOps Bot"
          git config user.email "gitops-bot@github.com"
          git add overlays/staging/kustomization.yaml
          git diff --cached --quiet || git commit -m "chore: deploy sha-${SHA::7} to staging"
          git push
