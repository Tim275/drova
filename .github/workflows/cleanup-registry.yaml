name: Cleanup Registry

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Delete sha- tagged and attestation versions
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const services = [
              'api-gateway', 'user-service', 'trip-service',
              'driver-service', 'payment-service', 'chat-service', 'frontend'
            ];

            for (const service of services) {
              const packageName = `drova/${service}`;
              console.log(`\nProcessing ${packageName}...`);

              let versions;
              try {
                const resp = await github.rest.packages.getAllPackageVersionsForPackageOwnedByUser({
                  package_type: 'container',
                  package_name: packageName,
                  username: 'Tim275',
                  per_page: 100,
                });
                versions = resp.data;
              } catch (e) {
                console.log(`  Error listing: ${e.message}`);
                continue;
              }

              for (const v of versions) {
                const tags = v.metadata?.container?.tags ?? [];
                const shouldDelete =
                  tags.length === 0 ||
                  tags.some(t => t.startsWith('sha-')) ||
                  tags.some(t => t.startsWith('sha256-'));

                if (shouldDelete) {
                  try {
                    await github.rest.packages.deletePackageVersionForUser({
                      package_type: 'container',
                      package_name: packageName,
                      username: 'Tim275',
                      package_version_id: v.id,
                    });
                    console.log(`  Deleted: ${tags.join(',') || '(untagged)'} [id=${v.id}]`);
                  } catch (e) {
                    console.log(`  Failed to delete ${v.id}: ${e.message}`);
                  }
                } else {
                  console.log(`  Keeping: ${tags.join(',')}`);
                }
              }
            }
