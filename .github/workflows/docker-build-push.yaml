name: Build and Push Docker Images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  pull-requests: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/tim275/drova

jobs:
  build-and-push:
    name: Build and Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            dockerfile: services/api-gateway/Dockerfile
            context: .
          - service: user-service
            dockerfile: services/user-service/Dockerfile
            context: .
          - service: trip-service
            dockerfile: services/trip-service/Dockerfile
            context: .
          - service: driver-service
            dockerfile: services/driver-service/Dockerfile
            context: .
          - service: payment-service
            dockerfile: services/payment-service/Dockerfile
            context: .
          - service: chat-service
            dockerfile: services/chat-service/Dockerfile
            context: .
          - service: frontend
            dockerfile: frontend/Dockerfile
            context: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.ref_name }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  trigger_gitops:
    name: Trigger GitOps
    needs: build-and-push
    if: needs.build-and-push.result == 'success'
    uses: ./.github/workflows/update-gitops.yaml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      GITOPS_PAT: ${{ secrets.GITOPS_PAT }}

