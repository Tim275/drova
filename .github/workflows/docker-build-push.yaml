name: Build and Push Images

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/tim275/drova

jobs:
  prepare:
    name: Extract tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.TAG }}
    steps:
      - name: Extract tag
        id: tag
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

  build-and-push:
    name: Build ${{ matrix.service }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            dockerfile: services/api-gateway/Dockerfile
          - service: user-service
            dockerfile: services/user-service/Dockerfile
          - service: trip-service
            dockerfile: services/trip-service/Dockerfile
          - service: driver-service
            dockerfile: services/driver-service/Dockerfile
          - service: payment-service
            dockerfile: services/payment-service/Dockerfile
          - service: chat-service
            dockerfile: services/chat-service/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ needs.prepare.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          platforms: linux/amd64
          provenance: mode=max
          sbom: true

  trigger-gitops:
    name: Update GitOps
    needs: [prepare, build-and-push]
    if: needs.build-and-push.result == 'success'
    permissions: {}
    uses: ./.github/workflows/update-gitops.yaml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
    secrets:
      GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
