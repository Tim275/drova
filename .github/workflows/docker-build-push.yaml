name: Build and Push Docker Images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
        description: "Tag to build and deploy (e.g. v0.16.0)"

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pull-requests: write
  id-token: write
  attestations: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/tim275/drova
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    name: Build and Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            dockerfile: services/api-gateway/Dockerfile
            context: .
            paths: "services/api-gateway shared go.mod go.sum"
          - service: user-service
            dockerfile: services/user-service/Dockerfile
            context: .
            paths: "services/user-service shared go.mod go.sum"
          - service: trip-service
            dockerfile: services/trip-service/Dockerfile
            context: .
            paths: "services/trip-service shared go.mod go.sum"
          - service: driver-service
            dockerfile: services/driver-service/Dockerfile
            context: .
            paths: "services/driver-service shared go.mod go.sum"
          - service: payment-service
            dockerfile: services/payment-service/Dockerfile
            context: .
            paths: "services/payment-service shared go.mod go.sum"
          - service: chat-service
            dockerfile: services/chat-service/Dockerfile
            context: .
            paths: "services/chat-service shared go.mod go.sum"
          - service: frontend
            dockerfile: frontend/Dockerfile
            context: frontend
            paths: "frontend"

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag
        id: tag
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Setup crane
        uses: imjasonh/setup-crane@31b88efe9de28ae0ffa220711af4b60be9435f6e # v0.4

      - name: Check if service changed since last tag
        id: changed
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "prev_tag=" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT
          CHANGED=false
          for path in ${{ matrix.paths }}; do
            if git diff --name-only "$PREV_TAG" HEAD | grep -q "^$path"; then
              CHANGED=true
              break
            fi
          done
          if [ "$CHANGED" = "false" ]; then
            if ! crane digest ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${PREV_TAG} > /dev/null 2>&1; then
              echo "🔄 ${{ matrix.service }}:${PREV_TAG} fehlt in Registry — rebuild"
              CHANGED=true
            else
              echo "⏭ ${{ matrix.service }}: keine Änderungen seit $PREV_TAG — re-tag"
            fi
          else
            echo "🔨 ${{ matrix.service }}: Änderungen gefunden — rebuild"
          fi
          echo "changed=$CHANGED" >> $GITHUB_OUTPUT

      - name: Build and Push
        id: build
        if: steps.changed.outputs.changed == 'true'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          sbom: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ steps.tag.outputs.TAG }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Re-tag unchanged image
        id: retag
        if: steps.changed.outputs.changed == 'false'
        run: |
          crane tag ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ steps.changed.outputs.prev_tag }} ${{ steps.tag.outputs.TAG }}
          crane tag ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ steps.changed.outputs.prev_tag }} latest
          DIGEST=$(crane digest ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ steps.tag.outputs.TAG }})
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      - name: Collect digest
        id: digest
        run: |
          if [ "${{ steps.changed.outputs.changed }}" = "true" ]; then
            echo "value=${{ steps.build.outputs.digest }}" >> $GITHUB_OUTPUT
          else
            echo "value=${{ steps.retag.outputs.digest }}" >> $GITHUB_OUTPUT
          fi

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image
        run: |
          cosign sign --yes \
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}@${{ steps.digest.outputs.value }}

      - name: Attest build provenance (SLSA L3)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          subject-digest: ${{ steps.digest.outputs.value }}
          push-to-registry: true

      - name: Scan image with Trivy
        if: steps.changed.outputs.changed == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ steps.tag.outputs.TAG }}"
          format: "sarif"
          output: "trivy-${{ matrix.service }}.sarif"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy SARIF
        if: steps.changed.outputs.changed == 'true' && !cancelled()
        uses: github/codeql-action/upload-sarif@68bde559dea0fdcac2102bfdf6230c5f70eb485e # v4
        with:
          sarif_file: "trivy-${{ matrix.service }}.sarif"
          category: "trivy-${{ matrix.service }}"

  trigger_gitops:
    name: Trigger GitOps
    needs: build-and-push
    if: needs.build-and-push.result == 'success'
    uses: ./.github/workflows/update-gitops.yaml
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    secrets:
      GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
