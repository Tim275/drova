name: Build and Push Latest

on:
  push:
    branches:
      - main

concurrency:
  group: latest-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/tim275/drova

jobs:
  build-latest:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            dockerfile: services/api-gateway/Dockerfile
          - service: user-service
            dockerfile: services/user-service/Dockerfile
          - service: trip-service
            dockerfile: services/trip-service/Dockerfile
          - service: driver-service
            dockerfile: services/driver-service/Dockerfile
          - service: payment-service
            dockerfile: services/payment-service/Dockerfile
          - service: chat-service
            dockerfile: services/chat-service/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push latest
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}-latest
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-latest
          platforms: linux/amd64
