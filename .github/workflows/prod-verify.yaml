name: Production Verify & Rollback

on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
        description: "Tag that was deployed (e.g. v0.16.0) — used for rollback if needed"
  repository_dispatch:
    types: [production-deployed]
    # Kein Tag im Payload noetig: der Rollback-Schritt liest den deployten Tag
    # direkt aus dem gitops-Manifest, das er ohnehin auscheckt.
    # Trigger from drova-gitops PostSync hook:
    #   curl -X POST https://api.github.com/repos/Tim275/drova/dispatches \
    #     -H "Authorization: Bearer $DROVA_PAT" \
    #     -d '{"event_type":"production-deployed","client_payload":{"deployed_at":"..."}}'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Smoke + Rollback if unhealthy
    runs-on: ubuntu-latest
    env:
      # Manueller Lauf (workflow_dispatch): Tag aus dem Input.
      # Auto-Lauf (repository_dispatch): leer → wird im Rollback-Schritt direkt
      # aus dem deployten gitops-Manifest gelesen. Kein Payload-Tag noetig.
      DEPLOY_TAG: ${{ github.event.inputs.tag }}

    steps:
      - name: Poll production health
        id: prod_health
        run: |
          URL="https://drova.timourhomelab.org/health"
          MAX=900
          INTERVAL=20
          ELAPSED=0
          CONSECUTIVE=0
          REQUIRED=3
          echo "Polling ${URL} (max ${MAX}s, every ${INTERVAL}s, need ${REQUIRED} consecutive 200s)..."
          while [ $ELAPSED -lt $MAX ]; do
            BODY=$(curl -sf --max-time 10 "$URL" 2>/dev/null || echo "")
            STATUS=$(curl -sf --max-time 10 -o /dev/null -w "%{http_code}" "$URL" 2>/dev/null || echo "000")

            if [ "$STATUS" = "200" ]; then
              if echo "$BODY" | grep -qiE "panic|runtime error|internal server error|exception"; then
                echo "  [${ELAPSED}s] ❌ error string in response body — resetting"
                CONSECUTIVE=0
              else
                CONSECUTIVE=$((CONSECUTIVE + 1))
                echo "  [${ELAPSED}s] ✓ ${STATUS} (${CONSECUTIVE}/${REQUIRED} consecutive)"
                if [ $CONSECUTIVE -ge $REQUIRED ]; then
                  echo "✓ Production stable after ${ELAPSED}s"
                  exit 0
                fi
              fi
            else
              echo "  [${ELAPSED}s] status=${STATUS} — resetting"
              CONSECUTIVE=0
            fi

            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          echo "❌ Production not healthy after ${MAX}s"
          exit 1

      - name: Integration smoke tests
        id: smoke
        env:
          # Seeded smoke user — strong password from a Sealed Secret, never in git.
          # The public "Test1234!" no longer works against prod.
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: |
          BASE="https://drova.timourhomelab.org"
          echo "--- /health ---"
          curl -sf "${BASE}/health" | grep -q "alive" && echo "✓ health ok"

          if [ -z "$SMOKE_PASSWORD" ]; then
            echo "❌ SMOKE_PASSWORD secret not set — cannot run authenticated smoke tests"
            exit 1
          fi

          echo "--- /v1/auth/token (Basic Auth) ---"
          TOKEN=$(curl -sf -u "rider@drova.local:${SMOKE_PASSWORD}" \
            -X POST "${BASE}/v1/auth/token" | jq -r '.data.token // .token // empty')
          [ -n "$TOKEN" ] && echo "✓ login ok" || { echo "❌ login failed"; exit 1; }

          echo "--- /v1/users/me ---"
          curl -sf -H "Authorization: Bearer ${TOKEN}" "${BASE}/v1/users/me" \
            | jq -e '.data.email // .email' > /dev/null && echo "✓ profile ok"

          echo "All production smoke tests passed ✓"

      - name: Checkout GitOps repository
        if: failure() && (steps.prod_health.conclusion == 'failure' || steps.smoke.conclusion == 'failure')
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Tim275/drova-gitops
          token: ${{ secrets.GITOPS_PAT }}
          ref: main
          path: drova-gitops

      - name: Rollback production
        if: failure() && (steps.prod_health.conclusion == 'failure' || steps.smoke.conclusion == 'failure')
        run: |
          cd drova-gitops
          git config user.name "GitOps Bot"
          git config user.email "gitops-bot@github.com"

          # Tag des laufenden Deploys ermitteln: bei manuellem Lauf aus dem Input,
          # sonst direkt aus dem gerade ausgecheckten Prod-Manifest lesen.
          # Single source of truth = was in Git steht; kein Dispatch-Payload noetig.
          if [ -z "$DEPLOY_TAG" ]; then
            DEPLOY_TAG=$(grep -m1 'newTag:' overlays/production/kustomization.yaml | awk '{print $2}')
            echo "Tag aus overlays/production/kustomization.yaml gelesen: ${DEPLOY_TAG:-<leer>}"
          fi
          if [ -z "$DEPLOY_TAG" ]; then
            echo "❌ Deploy-Tag nicht ermittelbar (weder Input noch Manifest) — Rollback ABGEBROCHEN."
            exit 1
          fi

          # Exakten Deploy-Commit fuer DIESEN Tag treffen — nicht blind HEAD.
          # Ein paralleler Commit (z.B. Staging-Bump des naechsten Release) koennte
          # sonst obendrauf sitzen und `git revert HEAD` das Falsche zuruecknehmen.
          TARGET=$(git log --format="%H %s" -30 \
            | grep -iE "update drova images to ${DEPLOY_TAG}([^0-9]|$)|deploy ${DEPLOY_TAG} to production" \
            | head -1 | awk '{print $1}')

          if [ -z "$TARGET" ]; then
            echo "❌ Kein Deploy-Commit für ${DEPLOY_TAG} in den letzten 30 Commits gefunden."
            echo "   → Rollback ABGEBROCHEN (kein blindes HEAD-Revert)."
            exit 1
          fi
          echo "Reverting deploy commit ${TARGET} for ${DEPLOY_TAG}"

          if ! git revert --no-edit "$TARGET"; then
            echo "❌ Revert conflicted — manual rollback required for ${DEPLOY_TAG}"
            git revert --abort || true
            exit 1
          fi
          git push
          echo "❌ Production rolled back — reverted ${TARGET} (${DEPLOY_TAG}) in drova-gitops"

      - name: Write job summary
        if: always()
        run: |
          echo "## Production Verify" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Schritt | Ergebnis |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Health-Poll | ${{ steps.prod_health.conclusion }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke-Tests | ${{ steps.smoke.conclusion }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Production gesund — Health-Poll UND Smoke-Tests bestanden" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Production NICHT gesund — siehe Tabelle oben" >> $GITHUB_STEP_SUMMARY
          fi
