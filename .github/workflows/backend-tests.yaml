name: Backend Tests

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  check_paths:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3.0.2
        id: filter
        with:
          filters: |
            backend:
              - 'services/**'
              - 'shared/**'
              - 'proto/**'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/backend-tests.yaml'

  test:
    name: Test Backend
    needs: check_paths
    if: ${{ needs.check_paths.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    env:
      GOFLAGS: "-mod=readonly"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.1
          args: --timeout=5m

      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Run tests
        run: go test -race -count=1 -timeout 3m ./...

      - name: Build all services
        run: |
          CGO_ENABLED=0 GOOS=linux go build -trimpath -ldflags="-w -s" -o /dev/null ./services/api-gateway
          CGO_ENABLED=0 GOOS=linux go build -trimpath -ldflags="-w -s" -o /dev/null ./services/user-service/cmd
          CGO_ENABLED=0 GOOS=linux go build -trimpath -ldflags="-w -s" -o /dev/null ./services/trip-service/cmd
          CGO_ENABLED=0 GOOS=linux go build -trimpath -ldflags="-w -s" -o /dev/null ./services/driver-service
          CGO_ENABLED=0 GOOS=linux go build -trimpath -ldflags="-w -s" -o /dev/null ./services/payment-service/cmd
          CGO_ENABLED=0 GOOS=linux go build -trimpath -ldflags="-w -s" -o /dev/null ./services/chat-service

      - name: Build Docker image
        run: docker build -t drova-api-gateway:latest -f services/api-gateway/Dockerfile .

      - name: Scan image
        uses: anchore/scan-action@v7
        with:
          image: "drova-api-gateway:latest"
          fail-build: false
          severity-cutoff: high
          output-format: table
