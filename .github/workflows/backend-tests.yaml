name: Backend Tests

on:
  pull_request:

concurrency:
  group: backend-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  packages: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check_paths:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'services/**'
              - 'shared/**'
              - 'proto/**'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/backend-tests.yaml'

  lint:
    name: Lint & Security Scan
    needs: check_paths
    if: ${{ needs.check_paths.outputs.should_run == 'true' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    env:
      GOFLAGS: "-mod=readonly"
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Secrets scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          recursive: true

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.12.2
          args: --timeout=5m

      - name: pre-commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

  test:
    name: Unit & Integration Tests
    needs: check_paths
    if: ${{ needs.check_paths.outputs.should_run == 'true' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    env:
      GOFLAGS: "-mod=readonly"

    services:
      postgres:
        image: postgres:17-alpine@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609
        env:
          POSTGRES_USER: drova
          POSTGRES_PASSWORD: drova
          POSTGRES_DB: drova_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drova -d drova_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: go test -race -count=1 -timeout 3m -coverprofile=coverage.out ./...

      - name: Coverage gate
        run: |
          # Unit-coverage of the business-logic layers (service/domain/sim/middleware/auth + shared libs).
          # Infra adapters (stores, kafka, http/ws/grpc) are covered by the integration job;
          # generated proto code is excluded.
          grep -E '^mode:' coverage.out > logic.cov
          grep -E '/internal/(service|domain|sim|middleware|auth)/|/shared/(util|env|retry)/' coverage.out >> logic.cov
          COVERAGE=$(go tool cover -func=logic.cov | grep total | awk '{print $3}' | tr -d '%')
          echo "Business-logic coverage: ${COVERAGE}%"
          if awk "BEGIN {exit !($COVERAGE < 40)}"; then
            echo "❌ Coverage ${COVERAGE}% is below threshold of 40%"
            exit 1
          fi
          echo "✓ Coverage ${COVERAGE}% meets threshold of 40%"

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

      - name: Run integration tests
        env:
          TEST_DB_URL: postgres://drova:drova@localhost:5432/drova_test?sslmode=disable
          MIGRATIONS_PATH: ${{ github.workspace }}/services/user-service/migrations
          TEST_REDIS_ADDR: localhost:6379
        run: go test -race -count=1 -tags=integration -timeout 2m ./...

  docker:
    name: Docker Build & Scan
    needs: check_paths
    if: ${{ needs.check_paths.outputs.should_run == 'true' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    env:
      GOFLAGS: "-mod=readonly"

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build all services
        run: |
          CGO_ENABLED=0 GOOS=linux go build -trimpath -ldflags="-w -s" -o /dev/null ./services/api-gateway
          CGO_ENABLED=0 GOOS=linux go build -trimpath -ldflags="-w -s" -o /dev/null ./services/user-service/cmd
          CGO_ENABLED=0 GOOS=linux go build -trimpath -ldflags="-w -s" -o /dev/null ./services/trip-service/cmd
          CGO_ENABLED=0 GOOS=linux go build -trimpath -ldflags="-w -s" -o /dev/null ./services/driver-service/cmd
          CGO_ENABLED=0 GOOS=linux go build -trimpath -ldflags="-w -s" -o /dev/null ./services/payment-service/cmd
          CGO_ENABLED=0 GOOS=linux go build -trimpath -ldflags="-w -s" -o /dev/null ./services/chat-service
          CGO_ENABLED=0 GOOS=linux go build -trimpath -ldflags="-w -s" -o /dev/null ./services/search-indexer/cmd

      - name: Build Docker images (all services)
        run: |
          docker build -t drova-api-gateway:latest     -f services/api-gateway/Dockerfile     . -q
          docker build -t drova-user-service:latest    -f services/user-service/Dockerfile    . -q
          docker build -t drova-trip-service:latest    -f services/trip-service/Dockerfile    . -q
          docker build -t drova-driver-service:latest  -f services/driver-service/Dockerfile  . -q
          docker build -t drova-payment-service:latest -f services/payment-service/Dockerfile . -q
          docker build -t drova-chat-service:latest    -f services/chat-service/Dockerfile    . -q
          docker build -t drova-search-indexer:latest  -f services/search-indexer/Dockerfile  . -q
          docker build -t drova-frontend:latest        -f frontend/Dockerfile frontend/        -q

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Trivy scan all images
        run: |
          FAILED=0
          for img in api-gateway user-service trip-service driver-service payment-service chat-service search-indexer frontend; do
            echo "=== drova-$img ==="
            trivy image --no-progress --ignore-unfixed \
              --pkg-types os,library --severity CRITICAL,HIGH \
              --exit-code 1 "drova-$img:latest" || FAILED=1
          done
          exit $FAILED

  e2e:
    name: E2E Smoke Tests
    needs: [check_paths, lint, test, docker]
    if: ${{ needs.check_paths.outputs.should_run == 'true' && github.event_name == 'pull_request' }}
    uses: ./.github/workflows/e2e-tests.yaml
    secrets:
      GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
      MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}

  # Single required status check. Runs always (even when the path-filtered jobs
  # skip) and passes when every required job either passed or skipped cleanly —
  # only a real failure/cancel fails it. Make THIS the required check in branch
  # protection so frontend-only / workflow-only PRs aren't blocked by skipped
  # backend jobs.
  ci-passed:
    name: CI Passed
    if: ${{ always() }}
    needs: [check_paths, lint, test, docker, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs passed or skipped
        run: |
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "::error::A required CI job failed or was cancelled"
            exit 1
          fi
          echo "✓ all required jobs passed or skipped cleanly"
