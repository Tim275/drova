name: Frontend Tests

on:
  pull_request:

concurrency:
  group: frontend-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check_paths:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'tests/frontend/**'
              - '.github/workflows/frontend-tests.yaml'

  test:
    name: Test Frontend
    needs: check_paths
    if: ${{ needs.check_paths.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'

      - name: Verify frontend exists
        run: |
          test -f frontend/index.html
          echo "frontend/index.html: $(wc -l < frontend/index.html) lines"

      - name: Lint HTML with HTMLHint
        run: npx --yes htmlhint --config frontend/.htmlhintrc frontend/index.html

      - name: Validate HTML with tidy
        run: |
          sudo apt-get update -qq && sudo apt-get install -y tidy
          TIDY_EXIT=0
          tidy -errors -quiet -utf8 frontend/index.html || TIDY_EXIT=$?
          if [ $TIDY_EXIT -gt 1 ]; then
            echo "HTML has errors (tidy exit $TIDY_EXIT)" && exit 1
          fi
          echo "HTML OK (warnings expected for dynamic SPA)"

      - name: Check JavaScript syntax
        run: |
          node -e "
          const fs = require('fs');
          const html = fs.readFileSync('frontend/index.html', 'utf8');
          const re = /<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g;
          let m, n = 0, errs = 0;
          while ((m = re.exec(html)) !== null) {
            const code = m[1].trim();
            if (!code) continue;
            n++;
            try { new Function(code); }
            catch (e) {
              console.error('Script #' + n + ' syntax error:', e.message);
              errs++;
            }
          }
          console.log(n + ' inline scripts validated, ' + errs + ' errors');
          process.exit(errs > 0 ? 1 : 0);
          "

      - name: Check for debug leaks
        run: |
          if grep -n "debugger" frontend/index.html; then
            echo "ERROR: debugger statement found" && exit 1
          fi
          echo "No debugger statements found"

      - name: WS auth state regression tests
        run: node tests/frontend/ws-auth-state.test.mjs

      - name: Build Docker image
        run: docker build -t drova-frontend:latest frontend/

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "drova-frontend:latest"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          pkg-types: "os,library"
          severity: "CRITICAL,HIGH"

  # Real-browser integration: drives the running frontend (nginx → api-gateway
  # → user-service) to catch integration bugs that node-logic tests can't —
  # e.g. "logout doesn't actually kill the session".
  # EXPERIMENTAL: continue-on-error while the compose-in-CI networking is
  # stabilised (subset `up` hits Docker embedded-DNS flakiness). NOT a required
  # check — it surfaces results without gating merges. Promote to required once
  # the stack comes up reliably.
  frontend-e2e:
    name: Frontend E2E (Playwright)
    needs: check_paths
    if: ${{ needs.check_paths.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'

      - name: Write CI .env (postgres needs a password; DB_URL/redis must match)
        run: |
          cat > .env <<'EOF'
          POSTGRES_PASSWORD=drova
          REDIS_PASSWORD=drova
          JWT_SECRET=e2e-ci-jwt-secret-not-for-prod-pad32
          MAPBOX_PUBLIC_TOKEN=
          MAPBOX_TOKEN=
          MONGO_USERNAME=drova
          MONGO_PASSWORD=drova
          APP_BASE_URL=http://localhost:8090
          FROM_EMAIL=ci@e2e.local
          SMTP_HOST=localhost
          SMTP_PORT=1025
          SMTP_USERNAME=ci
          SMTP_PASSWORD=ci
          STRIPE_PUBLIC_KEY=pk_test_ci
          STRIPE_WEBHOOK_KEY=whsec_ci
          EOF

      - name: Build minimal stack images
        # chat-service is built+started too: nginx.conf proxy_passes to it, and
        # nginx resolves upstream hostnames at startup — a missing chat-service
        # makes nginx (the frontend container) refuse to boot.
        run: docker compose build user-service api-gateway chat-service frontend

      - name: Start minimal stack (auth-flow — no mapbox/es)
        run: |
          docker compose up -d postgres redis kafka mongodb
          echo "Waiting for backing services healthy..."
          timeout 90  bash -c 'until docker compose ps postgres | grep -q healthy; do sleep 3; done'
          timeout 90  bash -c 'until docker compose ps redis    | grep -q healthy; do sleep 3; done'
          timeout 150 bash -c 'until docker compose ps kafka    | grep -q healthy; do sleep 3; done'
          # chat-service only needs to be resolvable for nginx — not healthy.
          docker compose up -d --no-deps user-service api-gateway chat-service
          docker compose up -d --no-deps frontend
          echo "Waiting for frontend → api-gateway /health..."
          timeout 150 bash -c 'until curl -sf http://localhost:8090/health >/dev/null; do sleep 3; done'
          echo "✓ stack up"

      - name: Install Playwright
        working-directory: tests/frontend
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: tests/frontend
        env:
          BASE_URL: http://localhost:8090
        run: npm test

      - name: Dump service logs on failure
        if: failure()
        run: |
          echo "=== api-gateway ===" && docker compose logs --tail=60 api-gateway || true
          echo "=== user-service ===" && docker compose logs --tail=60 user-service || true
          echo "=== frontend ===" && docker compose logs --tail=30 frontend || true

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: tests/frontend/playwright-report/
          retention-days: 7
