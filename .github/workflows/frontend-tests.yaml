name: Frontend Tests

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-tests.yaml"

concurrency:
  group: frontend-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Validate Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify frontend exists
        run: |
          test -f frontend/index.html
          echo "frontend/index.html: $(wc -l < frontend/index.html) lines"

      - name: Validate HTML (errors only)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y tidy
          TIDY_EXIT=0
          tidy -errors -quiet -utf8 frontend/index.html || TIDY_EXIT=$?
          if [ $TIDY_EXIT -gt 1 ]; then
            echo "HTML has errors (tidy exit $TIDY_EXIT)" && exit 1
          fi
          echo "HTML OK (warnings are expected for dynamic SPA)"

      - name: Check for debug leaks
        run: |
          if grep -n "debugger" frontend/index.html; then
            echo "ERROR: debugger statement found" && exit 1
          fi
          if grep -n "console\.log" frontend/index.html; then
            echo "WARNING: console.log statements found:"
            grep -n "console\.log" frontend/index.html
          fi
          echo "No debugger statements found"
