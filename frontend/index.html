<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Drova</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f3f4f6; min-height: 100vh; }

    /* Welcome */
    #welcome { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; }
    .card { background: white; padding: 32px; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); width: 100%; max-width: 400px; text-align: center; }
    .card h2 { font-size: 22px; font-weight: 700; color: #111827; margin-bottom: 8px; }
    .card p  { color: #6b7280; font-size: 14px; margin-bottom: 28px; }
    .btn { display: block; width: 100%; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; border: none; transition: opacity .15s; }
    .btn:hover:not(:disabled) { opacity: .85; }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn-primary { background: #111827; color: white; margin-bottom: 12px; }
    .btn-outline { background: white; color: #111827; border: 1.5px solid #e5e7eb; }

    /* Map screen: sidebar + map + ridepanel */
    #mapscreen { display: none; height: 100vh; }
    #maplayout { display: flex; height: 100%; }

    /* Left sidebar */
    #sidebar {
      width: 280px; min-width: 280px;
      background: white;
      padding: 24px 20px;
      display: flex; flex-direction: column; gap: 10px;
      box-shadow: 2px 0 12px rgba(0,0,0,0.06);
      z-index: 1;
    }
    #sidebar h3 { font-size: 15px; font-weight: 700; color: #111827; margin-bottom: 4px; }
    .field-label { font-size: 11px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: .4px; margin-bottom: 4px; display: block; }
    .field-input { width: 100%; padding: 9px 11px; border: 1.5px solid #e5e7eb; border-radius: 8px; font-size: 13px; color: #111827; outline: none; }
    .field-input:focus { border-color: #111827; }
    #calcBtn { margin-top: 4px; padding: 11px; background: #111827; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; }
    #calcBtn:hover { opacity: .85; }
    #calcBtn:disabled { opacity: .5; cursor: not-allowed; }

    /* Map */
    #mapwrap { flex: 1; position: relative; }
    #map { position: absolute; inset: 0; }

    /* Ride panel */
    #ridepanel {
      display: none;
      width: 400px; min-width: 400px;
      background: white;
      padding: 32px 28px;
      overflow-y: auto;
      box-shadow: -2px 0 12px rgba(0,0,0,0.06);
    }
    #ridepanel h2 { font-size: 20px; font-weight: 700; color: #111827; margin-bottom: 6px; }
    #routeinfo  { font-size: 13px; color: #6b7280; margin-bottom: 6px; }
    #arrivalinfo { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #374151; margin-bottom: 24px; }

    .ride-option {
      display: flex; align-items: center; gap: 14px;
      padding: 16px; border: 1.5px solid #e5e7eb; border-radius: 12px;
      margin-bottom: 10px; cursor: pointer; transition: border-color .15s, background .15s;
    }
    .ride-option:hover { border-color: #111827; background: #f9fafb; }
    .ride-option.selected { border-color: #111827; background: #f9fafb; }
    .ride-icon { width: 40px; height: 40px; background: #f3f4f6; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .ride-icon svg { width: 22px; height: 22px; stroke: #111827; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .ride-info { flex: 1; }
    .ride-name { font-size: 15px; font-weight: 600; color: #111827; }
    .ride-desc { font-size: 12px; color: #6b7280; margin-top: 2px; }
    .ride-price { font-size: 16px; font-weight: 700; color: #111827; }

    #confirmbtn { margin-top: 16px; width: 100%; padding: 13px; background: #111827; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
    #confirmbtn:hover { opacity: .85; }
    #backbtn { margin-top: 10px; width: 100%; padding: 11px; background: white; color: #111827; border: 1.5px solid #e5e7eb; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
    #backbtn:hover { background: #f9fafb; }

    #errbox { margin-top: 8px; padding: 10px; background: #fef2f2; border-radius: 8px; font-size: 12px; color: #dc2626; display: none; }
    .style-opt { padding: 10px 16px; font-size: 13px; color: #111827; cursor: pointer; }
    .style-opt:hover { background: #f3f4f6; }
    #routeinfo { font-size: 15px; font-weight: 600; color: #111827; margin-bottom: 4px; }

    /* Driver panel */
    #driverpanel {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.4); z-index: 100;
      align-items: flex-end; justify-content: center;
    }
    #driverpanel.active { display: flex; }
    .driver-card {
      background: white; border-radius: 20px 20px 0 0;
      width: 100%; max-width: 480px; padding: 28px 24px 32px;
    }
    .driver-header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
    .driver-avatar { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; }
    .driver-name { font-size: 17px; font-weight: 700; color: #111827; }
    .driver-meta { font-size: 13px; color: #6b7280; margin-top: 2px; }
    .chat-messages {
      height: 200px; overflow-y: auto;
      border: 1.5px solid #e5e7eb; border-radius: 10px;
      padding: 12px; margin-bottom: 12px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .msg { padding: 8px 12px; border-radius: 10px; font-size: 13px; max-width: 80%; }
    .msg.sent { background: #111827; color: white; align-self: flex-end; }
    .msg.received { background: #f3f4f6; color: #111827; align-self: flex-start; }
    .chat-input { display: flex; gap: 8px; }
    .chat-input input { flex: 1; padding: 10px 12px; border: 1.5px solid #e5e7eb; border-radius: 8px; font-size: 13px; outline: none; }
    .chat-input input:focus { border-color: #111827; }
    .chat-input button { padding: 10px 18px; background: #111827; color: white; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
    #closedriverpanel { margin-top: 12px; width: 100%; padding: 11px; background: white; color: #111827; border: 1.5px solid #e5e7eb; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>

<!-- Welcome -->
<div id="welcome">
  <div class="card">
    <h2>Welcome to Drova</h2>
    <p>Choose how you'd like to use our service today</p>
    <button class="btn btn-primary" onclick="startRider()">I Need a Ride</button>
    <button class="btn btn-outline" disabled>I Want to Drive</button>
  </div>
</div>

<!-- Map screen -->
<div id="mapscreen">
  <div id="maplayout">

    <!-- Left sidebar -->
    <div id="sidebar">
      <h3>Plan your trip</h3>
      <div>
        <span class="field-label">Pickup</span>
        <input class="field-input" id="pickup" placeholder="e.g. Düsseldorf Hauptbahnhof">
      </div>
      <div>
        <span class="field-label">Destination</span>
        <input class="field-input" id="destination" placeholder="e.g. Köln Hauptbahnhof">
      </div>
      <button id="calcBtn" onclick="getRoute()">Calculate Route</button>
      <div id="errbox"></div>
    </div>

    <!-- Map -->
    <div id="mapwrap">
      <div id="map"></div>
      <!-- Style picker button (bottom-left, like Google Maps) -->
      <div id="stylepicker" style="position:absolute;bottom:24px;left:12px;z-index:2;">
        <button onclick="toggleStyleMenu()" style="background:white;border:none;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;color:#374151;box-shadow:0 2px 8px rgba(0,0,0,0.15);cursor:pointer;display:flex;align-items:center;gap:6px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/></svg>
          Map Style
        </button>
        <div id="stylemenu" style="display:none;position:absolute;bottom:36px;left:0;background:white;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,0.12);overflow:hidden;min-width:160px;">
          <div class="style-opt" onclick="setStyle('mapbox://styles/mapbox/light-v11','Light')">Light</div>
          <div class="style-opt" onclick="setStyle('mapbox://styles/mapbox/streets-v12','Streets')">Streets</div>
          <div class="style-opt" onclick="setStyle('mapbox://styles/mapbox/navigation-day-v1','Navigation')">Navigation</div>
          <div class="style-opt" onclick="setStyle('mapbox://styles/mapbox/outdoors-v12','Outdoors')">Outdoors</div>
          <div class="style-opt" onclick="setStyle('mapbox://styles/mapbox/satellite-streets-v12','Satellite')">Satellite</div>
          <div class="style-opt" onclick="setStyle('mapbox://styles/mapbox/dark-v11','Dark')">Dark</div>
        </div>
      </div>
    </div>

    <!-- Ride selection panel -->
    <div id="ridepanel">
      <h2>Select your desired ride</h2>
      <div id="routeinfo"></div>
      <div id="arrivalinfo"></div>
      <div id="rideoptions"></div>
      <button id="confirmbtn" onclick="confirmRide()">Confirm Ride</button>
      <button id="backbtn" onclick="backToMap()">Back to Map</button>
    </div>

  </div>
</div>

<!-- Driver panel (WebSocket) -->
<div id="driverpanel">
  <div class="driver-card">
    <div class="driver-header">
      <img id="driverAvatar" class="driver-avatar" src="" alt="Driver">
      <div>
        <div id="driverName" class="driver-name"></div>
        <div id="driverMeta" class="driver-meta"></div>
      </div>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input">
      <input id="chatInput" type="text" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMessage()">
      <button onclick="sendMessage()">Send</button>
    </div>
    <button id="closedriverpanel" onclick="closeDriverPanel()">Close</button>
  </div>
</div>

<script>
  let map, selectedRide = null, selectedFareID = null;
  let pickupCoords = null, destinationCoords = null;
  let pickupMarker = null, destinationMarker = null;
  const markers = [];

  // SVG icons matching Thiago's outline style
  const icons = {
    economy:  `<svg viewBox="0 0 24 24"><path d="M7 17H3a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h1l4-4h6l4 4h1a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-4"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg>`,
    comfort:  `<svg viewBox="0 0 24 24"><path d="M5 17H3a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1l3-3h8l3 3h1a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/><path d="M5 9h14"/></svg>`,
    van:      `<svg viewBox="0 0 24 24"><rect x="1" y="7" width="22" height="12" rx="2"/><path d="M1 11h22M7 7V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v2"/><circle cx="7" cy="19" r="2"/><circle cx="17" cy="19" r="2"/></svg>`,
    business: `<svg viewBox="0 0 24 24"><path d="M2 17H1a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1h1l3-4h10l3 4h1a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1h-2"/><path d="M5 9h14"/><path d="M8 9V7"/><circle cx="6" cy="17" r="2"/><circle cx="18" cy="17" r="2"/><path d="M8 17h8"/></svg>`,
  };

  const vehicles = [
    { id: 'economy',  name: 'Economy',  desc: 'VW Golf, Skoda Octavia',        rateBase: 5,  rateKm: 1.2 },
    { id: 'comfort',  name: 'Comfort',  desc: 'BMW 3er, Mercedes C-Klasse',    rateBase: 8,  rateKm: 1.8 },
    { id: 'van',      name: 'Van',      desc: 'VW Touran, Ford Galaxy',         rateBase: 10, rateKm: 2.0 },
    { id: 'business', name: 'Business', desc: 'Mercedes E-Klasse, Audi A6',    rateBase: 15, rateKm: 2.5 },
  ];

  async function reverseGeocode(lng, lat) {
    const url = `https://api.mapbox.com/geocoding/v5/mapbox.places/${lng},${lat}.json?access_token=${mapboxgl.accessToken}&limit=1&language=de`;
    const res  = await fetch(url);
    const data = await res.json();
    return data.features?.[0]?.place_name ?? `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
  }

  async function geocode(address) {
    const url = `https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(address)}.json?access_token=${mapboxgl.accessToken}&limit=1&country=de`;
    const res  = await fetch(url);
    const data = await res.json();
    console.log('geocode response:', JSON.stringify(data));
    if (!data.features?.length) throw new Error(`Adresse nicht gefunden: ${address}`);
    const [lng, lat] = data.features[0].center;
    return { latitude: lat, longitude: lng };
  }

  async function startRider() {
    document.getElementById('welcome').style.display = 'none';
    document.getElementById('mapscreen').style.display = 'block';

    const cfg = await fetch('http://localhost:8081/config').then(r => r.json());
    mapboxgl.accessToken = cfg.mapboxToken;

    map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/streets-v12',
      center: [10.5, 51.2],
      zoom: 6,
    });
    map.addControl(new mapboxgl.NavigationControl(), 'bottom-right');
  }

  async function getRoute() {
    const pickup      = document.getElementById('pickup').value.trim();
    const destination = document.getElementById('destination').value.trim();
    if (!pickup || !destination) {
      document.getElementById('errbox').style.display = 'block';
      document.getElementById('errbox').textContent = 'Bitte beide Adressen eingeben';
      return;
    }

    const btn    = document.getElementById('calcBtn');
    const errbox = document.getElementById('errbox');
    errbox.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Calculating...';

    try {
      pickupCoords      = await geocode(pickup);
      destinationCoords = await geocode(destination);

      const resp = await fetch('http://localhost:8081/trip/preview', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userID: 'user-1', pickup: pickupCoords, destination: destinationCoords })
      });
      if (!resp.ok) throw new Error('API error ' + resp.status);
      const json  = await resp.json();
      const route = json.data?.route;
      const fares = json.data?.rideFares;
      if (!route) throw new Error('No route found');

      placeMarkers(pickupCoords, destinationCoords);
      drawRoute(route);
      showRidePanel(route, fares);

    } catch (e) {
      errbox.style.display = 'block';
      errbox.textContent = e.message;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Calculate Route';
    }
  }

  function placeMarkers(pickup, destination) {
    if (pickupMarker) pickupMarker.remove();
    if (destinationMarker) destinationMarker.remove();

    pickupMarker = new mapboxgl.Marker({ color: '#22c55e', draggable: true })
      .setLngLat([pickup.longitude, pickup.latitude])
      .addTo(map);

    destinationMarker = new mapboxgl.Marker({ color: '#22c55e', draggable: true })
      .setLngLat([destination.longitude, destination.latitude])
      .addTo(map);

    pickupMarker.on('dragend', async () => {
      const { lng, lat } = pickupMarker.getLngLat();
      pickupCoords = { latitude: lat, longitude: lng };
      document.getElementById('pickup').value = await reverseGeocode(lng, lat);
      fetchAndDrawRoute();
    });

    destinationMarker.on('dragend', async () => {
      const { lng, lat } = destinationMarker.getLngLat();
      destinationCoords = { latitude: lat, longitude: lng };
      document.getElementById('destination').value = await reverseGeocode(lng, lat);
      fetchAndDrawRoute();
    });
  }

  async function fetchAndDrawRoute() {
    try {
      const resp = await fetch('http://localhost:8081/trip/preview', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userID: 'user-1', pickup: pickupCoords, destination: destinationCoords })
      });
      if (!resp.ok) return;
      const json  = await resp.json();
      const route = json.data?.route;
      const fares = json.data?.rideFares;
      if (!route) return;
      drawRoute(route, false); // no fitBounds when dragging
      showRidePanel(route, fares);
    } catch (_) {}
  }

  function drawRoute(route, fitBounds = true) {
    const coords = route.geometry[0].coordinates.map(c => [c.longitude, c.latitude]);
    if (map.getSource('route')) {
      map.getSource('route').setData({ type: 'Feature', geometry: { type: 'LineString', coordinates: coords } });
    } else {
      map.addSource('route', { type: 'geojson', data: { type: 'Feature', geometry: { type: 'LineString', coordinates: coords } } });
      map.addLayer({ id: 'route-line', type: 'line', source: 'route', paint: { 'line-color': '#1d4ed8', 'line-width': 4 } });
    }

    if (fitBounds) {
      const bounds = coords.reduce((b, c) => b.extend(c), new mapboxgl.LngLatBounds(coords[0], coords[0]));
      map.fitBounds(bounds, { padding: 60 });
    }
  }

  function showRidePanel(route, fares) {
    const km  = route.distance / 1000;
    const min = Math.round(route.duration / 60);

    document.getElementById('routeinfo').textContent  = `Routing for ${km.toFixed(2)} km`;
    document.getElementById('arrivalinfo').innerHTML  = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg> You'll arrive in: ${min} minutes`;

    document.getElementById('rideoptions').innerHTML = fares.map(fare => {
      const v     = vehicles.find(x => x.id === fare.packageSlug) ?? { name: fare.packageSlug, desc: '' };
      const price = (fare.totalPriceInCents / 100).toFixed(2);
      return `
        <div class="ride-option" id="opt-${fare.packageSlug}" onclick="selectRide('${fare.packageSlug}', '${fare.id}')">
          <div class="ride-icon">${icons[fare.packageSlug] ?? ''}</div>
          <div class="ride-info">
            <div class="ride-name">${v.name}</div>
            <div class="ride-desc">${v.desc}</div>
          </div>
          <div class="ride-price">€${price}</div>
        </div>`;
    }).join('');

    document.getElementById('ridepanel').style.display = 'block';
    setTimeout(() => map.resize(), 50);
  }

  function selectRide(id, fareID) {
    selectedRide   = id;
    selectedFareID = fareID;
    document.querySelectorAll('.ride-option').forEach(el => el.classList.remove('selected'));
    document.getElementById('opt-' + id)?.classList.add('selected');
  }

  function toggleStyleMenu() {
    const m = document.getElementById('stylemenu');
    m.style.display = m.style.display === 'none' ? 'block' : 'none';
  }

  function setStyle(style, label) {
    map.setStyle(style);
    document.getElementById('stylemenu').style.display = 'none';
    document.querySelector('#stylepicker button').innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/></svg> ${label}`;
  }

  // Close style menu when clicking outside
  document.addEventListener('click', (e) => {
    if (!document.getElementById('stylepicker')?.contains(e.target)) {
      document.getElementById('stylemenu').style.display = 'none';
    }
  });

  function backToMap() {
    document.getElementById('ridepanel').style.display = 'none';
    setTimeout(() => map.resize(), 50);
  }

  let ws = null;

  async function confirmRide() {
    if (!selectedRide || !selectedFareID) { alert('Please select a ride type'); return; }

    await fetch('http://localhost:8081/trip/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ rideFareID: selectedFareID, userID: 'user-1' })
    });

    ws = new WebSocket(`ws://localhost:8081/ws/drivers?userID=driver-1&packageSlug=${selectedRide}`);

    ws.onopen = () => {
      document.getElementById('driverName').textContent = 'Finding your driver...';
      document.getElementById('driverMeta').textContent = '';
      document.getElementById('driverAvatar').src = '';
      document.getElementById('chatMessages').innerHTML = '';
      document.getElementById('driverpanel').classList.add('active');
    };

    ws.onmessage = (event) => {
      const msg = JSON.parse(event.data);
      if (msg.type === 'driver.cmd.register') {
        const d = msg.data;
        document.getElementById('driverName').textContent = d.name;
        document.getElementById('driverMeta').textContent = `${d.carPlate} · ${d.packageSlug}`;
        document.getElementById('driverAvatar').src = d.profilePicture;
        addChatMessage(`Hi! I'm ${d.name}, your ${d.packageSlug} driver. I'm on my way!`, 'received');
      } else {
        addChatMessage(msg.data, 'received');
      }
    };

    ws.onclose = () => addChatMessage('Driver disconnected.', 'received');
  }

  function addChatMessage(text, type) {
    const el = document.createElement('div');
    el.className = `msg ${type}`;
    el.textContent = text;
    const box = document.getElementById('chatMessages');
    box.appendChild(el);
    box.scrollTop = box.scrollHeight;
  }

  function sendMessage() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text || !ws) return;
    ws.send(text);
    addChatMessage(text, 'sent');
    input.value = '';
  }

  function closeDriverPanel() {
    if (ws) { ws.close(); ws = null; }
    document.getElementById('driverpanel').classList.remove('active');
  }
</script>
</body>
</html>
