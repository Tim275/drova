apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  ENVIRONMENT: "development"
  GATEWAY_HTTP_ADDR: ":8081"

  # Shared cluster infra (schon im Homelab vorhanden)
  # Kafka: Strimzi-Operator bootstrap service — exakten DNS-Namen pro Tenant-Namespace anpassen
  KAFKA_BROKERS: "kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"
  # Jaeger: shared tracing backend im Cluster
  JAEGER_ENDPOINT: "http://jaeger-collector.observability.svc.cluster.local:14268/api/traces"

  # Intra-Tenant Service Discovery
  TRIP_SERVICE_URL: "trip-service:9093"
  DRIVER_SERVICE_URL: "driver-service:9092"

  # Stripe App-Config
  STRIPE_SUCCESS_URL: "http://localhost:3000?payment=success"
  STRIPE_CANCEL_URL: "http://localhost:3000?payment=cancel"
  STRIPE_CURRENCY: "eur"
