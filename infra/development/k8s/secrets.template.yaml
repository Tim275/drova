# Copy this file to secrets.yaml and fill in real values.
# secrets.yaml is .gitignored.
---
apiVersion: v1
kind: Secret
metadata:
  name: mapbox-secrets
type: Opaque
stringData:
  mapbox-token: "<MAPBOX_TOKEN>"         # Backend — sk or pk with URL restriction
  mapbox-public-token: "<MAPBOX_PUBLIC>" # Frontend — pk, unrestricted
---
apiVersion: v1
kind: Secret
metadata:
  name: stripe-secrets
type: Opaque
stringData:
  stripe-secret-key: "<STRIPE_SECRET_KEY>"
  stripe-webhook-key: "<STRIPE_WEBHOOK_KEY>"
