syntax = "proto3";

package driver;

// Die Zahlen (= 1, = 2 ...) sind Field Tags — Protobuf serialisiert die Zahl, nicht den Namen.
// Niemals ändern oder wiederverwenden sobald der Code deployed ist, sonst bricht die Kommunikation.
option go_package = "shared/proto/driver;driver";

service DriverService {
  rpc RegisterDriver(RegisterDriverRequest) returns (RegisterDriverResponse);
  rpc UnregisterDriver(RegisterDriverRequest) returns (RegisterDriverResponse);
  rpc StreamLocation(stream LocationUpdate) returns (StreamLocationResponse);
}

message RegisterDriverRequest {
  string driverID = 1;
  string packageSlug = 2;
  string name = 3;
}

message RegisterDriverResponse {
  Driver driver = 1;
}

message Driver {
  string id = 1;
  string name = 2;
  string profilePicture = 3;
  string carPlate = 4;
  string geohash = 5;
  string packageSlug = 6;
  Location location = 7;
}

message Location {
  double latitude = 1;
  double longitude = 2;
}

message LocationUpdate {
  string driver_id = 1;
  double latitude = 2;
  double longitude = 3;
}

message StreamLocationResponse {}
