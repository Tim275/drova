version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - misspell
  settings:
    gosec:
      excludes:
        - G115
        - G404
        - G104
  exclusions:
    rules:
      # tests: relax errcheck and gosec
      - path: "_test\\.go"
        linters:
          - gosec
          - errcheck
      # defer Close/Sync/Shutdown errors are intentionally ignored
      - linters:
          - errcheck
        text: "Error return value of `.*\\.Close`"
      - linters:
          - errcheck
        text: "Error return value of `.*\\.Sync`"
      - linters:
          - errcheck
        text: "Error return value of `.*\\.Shutdown`"
      - linters:
          - errcheck
        text: "Error return value of `.*\\.SetReadDeadline`"
      - linters:
          - errcheck
        text: "Error return value of `.*\\.SetWriteDeadline`"
      # writeJSON helper: response write errors can't be acted on
      - linters:
          - errcheck
        text: "Error return value of `writeJSON`"
      - linters:
          - errcheck
        text: "Error return value is not checked"
        path: "http\\.go"
