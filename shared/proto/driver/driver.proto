syntax = "proto3";
package driver;
option go_package = "drova/shared/proto/driver";

service DriverService {
  rpc RegisterDriver(RegisterDriverRequest)   returns (RegisterDriverResponse);
  rpc UnregisterDriver(RegisterDriverRequest) returns (RegisterDriverResponse);
  rpc StreamLocation(stream LocationUpdate)   returns (StreamLocationResponse);
  rpc GetNearbyDrivers(NearbyDriversRequest)  returns (NearbyDriversResponse);
}

message RegisterDriverRequest {
  string driverID    = 1;
  string packageSlug = 2;
  string name        = 3;
  double lat         = 4;
  double lng         = 5;
}

message RegisterDriverResponse {
  Driver driver            = 1;
  string busy_with_trip_id = 2;
}

message Driver {
  string   id             = 1;
  string   name           = 2;
  string   profilePicture = 3;
  string   carPlate       = 4;
  string   geohash        = 5;
  string   packageSlug    = 6;
  Location location       = 7;
}

message Location {
  double latitude  = 1;
  double longitude = 2;
}

message LocationUpdate {
  string driver_id = 1;
  double latitude  = 2;
  double longitude = 3;
}

message StreamLocationResponse {}

message NearbyDriversRequest {
  double lat          = 1;
  double lng          = 2;
  double radius_km    = 3;
  string package_slug = 4;
}

message NearbyDriversResponse {
  repeated Driver drivers = 1;
}
